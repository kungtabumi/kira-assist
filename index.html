    <script>
      (function() {
        // 1. Intercept console.error and console.warn to suppress benign dev-server WebSocket messages
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : a.toString()))) || '';
          }).join(' ').toLowerCase();

          if (
            text.indexOf('failed to connect to websocket') !== -1 ||
            text.indexOf('websocket closed without opened') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('websocket') !== -1)
          ) {
            // Silently suppress benign Vite HMR websocket reconnection notices in container dev environment
            return;
          }
          return originalConsoleError.apply(console, args);
        };

        var originalConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) {
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : a.toString()))) || '';
          }).join(' ').toLowerCase();

          if (
            text.indexOf('failed to connect to websocket') !== -1 ||
            text.indexOf('websocket closed without opened') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('websocket') !== -1)
          ) {
            return;
          }
          return originalConsoleWarn.apply(console, args);
        };

        // 2. Intercept unhandledrejection and window error events
        function isViteWsError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || (err.reason && (err.reason.message || err.reason.toString())) || String(err))).toLowerCase();
          return msg.indexOf('websocket') !== -1 || msg.indexOf('failed to connect') !== -1 || msg.indexOf('closed without opened') !== -1;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.message) || isViteWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        // 3. Mock Vite HMR WebSocket so that @vite/client never fails or attempts failing network upgrade
        var RealWebSocket = window.WebSocket;
        function MockViteWebSocket(url, protocols) {
          var protoStr = Array.isArray(protocols) ? protocols.join(',') : (protocols || '');
          var isVite = protoStr.indexOf('vite-hmr') !== -1 ||
            (typeof url === 'string' && (
              url.indexOf(':24678') !== -1 ||
              url.indexOf('token=') !== -1 ||
              url.indexOf('vite') !== -1 ||
              url.indexOf('hmr') !== -1
            ));

          if (!isVite && RealWebSocket) {
            try {
              return new RealWebSocket(url, protocols);
            } catch(e) {}
          }

          var self = this;
          var listeners = {};

          this.url = url;
          this.readyState = 1; // WebSocket.OPEN
          this.CONNECTING = 0;
          this.OPEN = 1;
          this.CLOSING = 2;
          this.CLOSED = 3;
          this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
          this.binaryType = 'blob';
          this.bufferedAmount = 0;
          this.extensions = '';
          this.onopen = null;
          this.onclose = null;
          this.onerror = null;
          this.onmessage = null;

          this.addEventListener = function(type, listener) {
            if (!listeners[type]) listeners[type] = [];
            listeners[type].push(listener);
          };

          this.removeEventListener = function(type, listener) {
            if (!listeners[type]) return;
            listeners[type] = listeners[type].filter(function(fn) { return fn !== listener; });
          };

          this.dispatchEvent = function(event) {
            var list = listeners[event.type] || [];
            for (var i = 0; i < list.length; i++) {
              try { list[i].call(self, event); } catch(err) {}
            }
            return true;
          };

          this.send = function() {};
          this.close = function() {
            self.readyState = 3;
          };

          setTimeout(function() {
            if (self.readyState === 1) {
              var openEvt = new Event('open');
              if (typeof self.onopen === 'function') {
                try { self.onopen.call(self, openEvt); } catch(e) {}
              }
              self.dispatchEvent(openEvt);
            }
          }, 0);
        }

        MockViteWebSocket.CONNECTING = 0;
        MockViteWebSocket.OPEN = 1;
        MockViteWebSocket.CLOSING = 2;
        MockViteWebSocket.CLOSED = 3;
        MockViteWebSocket.prototype.CONNECTING = 0;
        MockViteWebSocket.prototype.OPEN = 1;
        MockViteWebSocket.prototype.CLOSING = 2;
        MockViteWebSocket.prototype.CLOSED = 3;
        if (RealWebSocket) {
          MockViteWebSocket.prototype = Object.create(RealWebSocket.prototype);
          MockViteWebSocket.prototype.CONNECTING = 0;
          MockViteWebSocket.prototype.OPEN = 1;
          MockViteWebSocket.prototype.CLOSING = 2;
          MockViteWebSocket.prototype.CLOSED = 3;
        }

        window.WebSocket = MockViteWebSocket;
      })();
    </script>
